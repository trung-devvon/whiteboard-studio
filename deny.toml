# cargo-deny — kiểm tra giấy phép & lỗ hổng của thư viện Rust.
# Chính sách "Giữ cửa mở" (not_push_git/07 §0): chỉ cho phép giấy phép *cho phép* (permissive),
# KHÔNG GPL/AGPL/LGPL — để sau này vẫn tự do chọn open source hoặc bán.
# Chạy: cargo deny check

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Crate nội bộ (publish = false) không cần khai báo giấy phép
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
