# cargo-deny — kiểm tra giấy phép & lỗ hổng của thư viện Rust.
# Chính sách "Giữ cửa mở" (not_push_git/07 §0): chỉ cho phép giấy phép *cho phép* (permissive),
# KHÔNG GPL/AGPL/LGPL — để sau này vẫn tự do chọn open source hoặc bán.
# Chạy: cargo deny check

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Crate nội bộ (publish = false) không cần khai báo giấy phép
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Ngoại lệ có chủ đích — mỗi dòng phải có lý do và hạn xem lại.
ignore = [
    # Chỉ đến từ bộ thư viện Linux (GTK/D-Bus) mà Tauri dùng; không có bản thay thế ở phía ta. Xem lại khi Tauri nâng cấp.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: phụ thuộc gián tiếp của gtk-rs qua Tauri (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: phụ thuộc gián tiếp của Tauri (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: phụ thuộc gián tiếp của tauri-plugin-opener (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: phụ thuộc gián tiếp của tauri-plugin-opener (Linux D-Bus)" },
]
