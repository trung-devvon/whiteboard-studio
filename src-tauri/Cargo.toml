[package]
name = "whiteboard-studio"
description = "Whiteboard Studio — ứng dụng desktop (vỏ Tauri mỏng, logic nằm trong crates/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
# Hậu tố `_lib` cần thiết trên Windows để tên lib không trùng tên bin
# (https://github.com/rust-lang/cargo/issues/8519)
name = "whiteboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
wb-model.workspace = true
wb-project.workspace = true
wb-compile.workspace = true
wb-export.workspace = true
wb-audio.workspace = true

[lints]
workspace = true
