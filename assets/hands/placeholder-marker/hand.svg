        fill="url(#skin)" stroke="#B9835F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M262 336 C242 326 238 300 258 290 C280 280 304 298 316 318 L306 352 C290 354 274 348 262 336 Z"
        fill="url(#skin)" stroke="#B9835F" stroke-width="4" stroke-linejoin="round"/>
  <!-- ngón cái đè lên thân bút -->
  <path d="M268 214 C250 188 254 160 280 156 C306 152 330 178 336 206 C342 232 322 252 300 248 C288 246 278 232 268 214 Z"
        fill="url(#skin)" stroke="#B9835F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M286 170 C300 166 314 176 318 190" fill="none" stroke="#D49A76" stroke-width="3" stroke-linecap="round"/>
</svg>
