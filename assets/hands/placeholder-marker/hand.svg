<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <!-- Bàn tay TẠM (placeholder) tự vẽ cho Giai đoạn 1 — sẽ thay bằng ảnh tay chụp thật (File 09).
       Mũi bút tại (30, 34); cánh tay đi ra mép dưới-phải. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D3B3"/>
      <stop offset="1" stop-color="#E5B08C"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7DB8"/>
      <stop offset="1" stop-color="#3E5C93"/>
    </linearGradient>
  </defs>
  <!-- tay áo -->
  <path d="M372 438 L470 330 L1400 1240 L1400 1400 L1300 1400 Z" fill="url(#sleeve)" stroke="#2F4A7A" stroke-width="4" stroke-linejoin="round"/>
  <!-- cổ tay + lòng bàn tay -->
  <path d="M250 300 C270 250 340 236 392 262 C440 286 470 330 470 330 L372 438 C330 430 282 404 258 372 C242 350 240 324 250 300 Z"
        fill="url(#skin)" stroke="#B9835F" stroke-width="4" stroke-linejoin="round"/>
  <!-- thân bút dạ -->
  <g transform="rotate(45 58 62)">
    <rect x="58" y="44" width="300" height="36" rx="8" fill="#2D3A8C" stroke="#1B245C" stroke-width="3"/>
    <rect x="150" y="44" width="24" height="36" fill="#E8EAF2"/>
    <path d="M58 52 L30 58 L30 66 L58 72 Z" fill="#1A1A1A"/>
    <rect x="18" y="58" width="14" height="8" rx="3" fill="#111"/>
  </g>
  <!-- các ngón tay ôm bút -->
  <path d="M206 262 C188 232 196 204 222 200 C246 197 262 222 270 246 L262 286 C240 294 220 286 206 262 Z"
